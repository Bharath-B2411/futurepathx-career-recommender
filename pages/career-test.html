<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Test – Future PathX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.test-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
.question-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; animation: slideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
@media(max-width:768px){ .question-layout { grid-template-columns: 1fr; } }

.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2rem;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.question-image-wrap {
  width: 100%;
  aspect-ratio: 1;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg2);
}

.question-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.question-image:hover { transform: scale(1.05); }

.question-number { color: var(--gold); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.75rem; }
.question-text { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.3; color: var(--text); }
.options { display: flex; flex-direction: column; gap: 0.75rem; }

.option {
  padding: 1rem 1.25rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-size: 0.95rem;
  text-align: left;
  color: var(--text2);
  position: relative;
}

.option:hover { border-color: var(--gold); color: var(--gold); background: rgba(212,175,55,0.05); transform: translateX(10px); }
.option.selected { border-color: var(--gold); background: rgba(212,175,55,0.1); color: var(--gold); padding-left: 2rem; }
.option.selected::before { content: '✦'; position: absolute; left: 0.8rem; color: var(--gold); }

.btn-back {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  background: none;
  border: 1px solid var(--border);
  color: var(--text3);
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.4rem 0.8rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.btn-back:hover { border-color: var(--gold); color: var(--gold); background: rgba(212,175,55,0.05); }

.test-progress { text-align: center; margin-bottom: 3rem; position: relative; }
.test-progress-label { 
  color: var(--text2); 
  font-size: 0.85rem; 
  font-weight: 700; 
  margin-bottom: 0.8rem; 
  font-family: var(--font-display); 
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: all 0.3s ease;
}
.test-progress-label.pulse { color: var(--gold); transform: scale(1.05); }

.test-progress-bar { 
  height: 12px; 
  background: rgba(255, 255, 255, 0.03); 
  border-radius: 100px; 
  overflow: hidden; 
  border: 1px solid var(--border); 
  padding: 3px;
  backdrop-filter: blur(10px);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
}

.test-progress-fill { 
  height: 100%; 
  background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light)); 
  background-size: 200% 100%;
  border-radius: 100px; 
  transition: width 1s cubic-bezier(0.65, 0, 0.35, 1);
  box-shadow: 0 0 20px var(--gold-glow), 0 0 40px rgba(212, 175, 55, 0.1);
  position: relative;
  animation: shimmer 2s infinite linear;
}

.test-progress-fill::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transform: translateX(-100%);
  animation: scan 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes shim {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

@keyframes scan {
  0% { transform: translateX(-100%); }
  50%, 100% { transform: translateX(100%); }
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fadeOut {
  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(-30px); }
}

.fadeOut { animation: fadeOut 0.4s forwards; }

.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3rem;
  text-align: center;
  box-shadow: var(--shadow);
  animation: slideIn 0.8s ease;
}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-brand">Future<span>PathX</span></div>
  <div class="nav-links">
    <a href="../index.html">Dashboard</a>
    <a href="career-test.html" class="active">Career Test</a>
    <a href="career-explorer.html">Explore Careers</a>
    <a href="resume-builder.html">Resume Builder</a>
    <a href="roadmap.html">Roadmap</a>
    <a href="skill-gap.html">Skill Gap</a>
    <a href="resources.html">Resources</a>
  </div>
  <div class="nav-user">
    <div class="avatar" id="userAvatar">I</div>
    <span class="u-name">Innovator</span>
    <button class="logout-btn-header" onclick="handleLogout()" title="Sign Out">✕</button>
  </div>
</nav>

<div class="page-hero">
  <div class="container">
    <h1>🧪 Career Assessment Test</h1>
    <p>Answer 10 questions to discover your best-fit career paths based on your personality, skills, and interests.</p>
  </div>
</div>

<div class="section">
  <div class="test-container" id="testArea">
    <div class="test-progress">
      <div class="test-progress-label">Question <span id="qNum">1</span> of 10</div>
      <div class="test-progress-bar"><div class="test-progress-fill" id="progressFill" style="width:10%"></div></div>
    </div>
    <div id="questionArea"></div>
    <div class="test-nav" style="display:none">
      <button class="btn btn-ghost" id="prevBtn" onclick="prevQ()">← Previous</button>
      <button class="btn btn-accent" id="nextBtn" onclick="nextQ()">Next →</button>
    </div>
  </div>
</div>

<script src="../js/main.js"></script>
<script>
const questions = [
  { text: "Do you enjoy solving complex analytical problems?", img: "../assets/test/q1.png", options: ["Yes, I love it", "Sometimes", "Not really", "No, I prefer creative work"], scores: { tech: [3,1,0,0], data: [3,1,0,0], design: [0,1,2,3], management: [1,2,1,1] } },
  { text: "How comfortable are you with writing code or programming?", img: "../assets/test/q2.png", options: ["Very comfortable", "Somewhat comfortable", "Learning it", "Not comfortable"], scores: { tech: [3,2,1,0], data: [2,2,1,0], design: [1,1,1,0], management: [0,1,1,1] } },
  { text: "Do you enjoy working with large datasets and finding patterns?", img: "../assets/test/q3.png", options: ["Yes, very much", "It's interesting", "Not particularly", "I prefer other things"], scores: { tech: [1,2,0,0], data: [3,2,0,0], design: [0,1,1,0], management: [1,1,1,1] } },
  { text: "How would you describe your creativity level?", img: "../assets/test/q4.png", options: ["Highly creative", "Moderately creative", "Somewhat technical", "Highly technical"], scores: { tech: [0,1,2,3], data: [0,1,2,2], design: [3,2,1,0], management: [1,2,2,1] } },
  { text: "Do you enjoy leading teams and making strategic decisions?", img: "../assets/test/q5.png", options: ["Yes, definitely", "Sometimes", "I prefer individual work", "Not my thing"], scores: { tech: [0,1,2,1], data: [0,1,2,1], design: [0,1,2,1], management: [3,2,1,0] } },
  { text: "How do you feel about continuous learning in fast-changing fields?", img: "../assets/test/q6.png", options: ["I love it", "It's fine", "Somewhat overwhelming", "I prefer stable knowledge"], scores: { tech: [3,2,1,0], data: [3,2,1,0], design: [2,2,1,0], management: [1,2,2,1] } },
  { text: "Do you enjoy designing visual interfaces or user experiences?", img: "https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&q=80&w=800", options: ["Yes, it's my passion", "I like it", "Not really", "No preference"], scores: { tech: [0,1,2,1], data: [0,0,2,1], design: [3,2,0,0], management: [0,1,1,2] } },
  { text: "How important is social impact in your career?", img: "https://images.unsplash.com/photo-1593113598332-cd288d649433?auto=format&fit=crop&q=80&w=800", options: ["Extremely important", "Somewhat important", "Nice to have", "Not a priority"], scores: { tech: [1,2,1,1], data: [1,2,1,1], design: [2,2,1,0], management: [3,2,1,0] } },
  { text: "Do you prefer working alone or collaborating with a team?", img: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&q=80&w=800", options: ["Alone mostly", "Mix of both", "Team environment", "Depends on project"], scores: { tech: [2,2,1,2], data: [2,2,1,2], design: [2,2,1,2], management: [0,1,3,2] } },
  { text: "Which activity excites you the most?", img: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&q=80&w=800", options: ["Building AI systems", "Analyzing business data", "Designing beautiful apps", "Leading a product team"], scores: { tech: [3,1,1,0], data: [0,3,0,1], design: [0,0,3,1], management: [0,1,1,3] } }
];

let current = 0;
let answers = new Array(10).fill(null);

function renderQuestion() {
  const q = questions[current];
  const qNumLabel = document.getElementById('qNum').parentElement;
  
  // Pulse effect on progress update
  qNumLabel.classList.add('pulse');
  setTimeout(() => qNumLabel.classList.remove('pulse'), 600);

  document.getElementById('qNum').textContent = current + 1;
  document.getElementById('progressFill').style.width = `${(current + 1) * 10}%`;

  const area = document.getElementById('questionArea');
  area.innerHTML = `
    <div class="question-layout" id="qLayout">
      <div class="question-image-wrap">
        <img class="question-image" src="${q.img}" alt="Concept Image">
      </div>
      <div class="question-card">
        ${current > 0 ? `<button class="btn-back" onclick="prevQ()">← Back</button>` : ''}
        <div class="question-number">Question ${current + 1}</div>
        <div class="question-text">${q.text}</div>
        <div class="options">
          ${q.options.map((o, i) => `<button class="option ${answers[current] === i ? 'selected' : ''}" onclick="selectAnswer(${i})">${o}</button>`).join('')}
        </div>
      </div>
    </div>`;
}

function prevQ() {
  if (current > 0) {
    const layout = document.getElementById('qLayout');
    if (layout) layout.classList.add('fadeOut');
    
    setTimeout(() => {
      current--;
      renderQuestion();
    }, 400);
  }
}

function selectAnswer(i) {
  answers[current] = i;
  document.querySelectorAll('.option').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
  
  // Auto advance with delay for animation
  setTimeout(() => {
    const layout = document.getElementById('qLayout');
    if (layout) layout.classList.add('fadeOut');
    
    setTimeout(() => {
      if (current < 9) {
        current++;
        renderQuestion();
      } else {
        showResults();
      }
    }, 400);
  }, 500);
}

function showResults() {
  const careerData = {
    tech: {
      desc: "Design and build intelligent systems using machine learning, neural networks, and large language models. You will be at the forefront of AI innovation.",
      salary: "₹12L – ₹30L",
      skills: ["Python", "TensorFlow", "PyTorch", "NLP", "Linear Algebra"],
      icon: "🤖"
    },
    data: {
      desc: "Extract insights from complex datasets and build predictive models to drive strategic business decisions. You turn raw data into gold.",
      salary: "₹10L – ₹25L",
      skills: ["SQL", "Statistics", "R/Python", "Tableau", "Big Data"],
      icon: "📊"
    },
    design: {
      desc: "Create beautiful, user-centered designs and seamless digital experiences. You bridge the gap between human psychology and digital interfaces.",
      salary: "₹6L – ₹18L",
      skills: ["Figma", "User Research", "Prototyping", "Adobe XD", "Wireframing"],
      icon: "🎨"
    },
    management: {
      desc: "Lead cross-functional teams to build and launch successful products. You are the strategic visionary connecting business, tech, and users.",
      salary: "₹15L – ₹40L",
      skills: ["Agile", "Strategy", "Communication", "Product Roadmap", "Market Research"],
      icon: "📋"
    }
  };

  const totals = { tech: 0, data: 0, design: 0, management: 0 };
  questions.forEach((q, qi) => {
    const ans = answers[qi];
    if (ans !== null) {
      Object.keys(totals).forEach(k => { totals[k] += q.scores[k][ans]; });
    }
  });

  const careers = [
    { name: 'AI / ML Engineer', score: totals.tech, key: 'tech' },
    { name: 'Data Scientist', score: totals.data, key: 'data' },
    { name: 'UI/UX Designer', score: totals.design, key: 'design' },
    { name: 'Product Manager', score: totals.management, key: 'management' }
  ].sort((a, b) => b.score - a.score);

  const maxScore = 30;
  const top = careers[0];

  document.getElementById('testArea').innerHTML = `
    <div class="result-card" style="max-width:900px; margin: 0 auto; text-align: left;">
      <div style="text-align:center; margin-bottom: 2.5rem;">
        <div class="result-icon">🎉</div>
        <div class="result-title">Your Career Matches</div>
        <div class="result-subtitle">We found ${careers.length} potential career paths for you, ordered by match compatibility.</div>
      </div>

      <div class="result-details-grid" style="display: flex; flex-direction: column; gap: 1.5rem;">
        ${careers.map((c, i) => {
          const info = careerData[c.key];
          const pct = Math.round((c.score / maxScore) * 100);
          return `
            <div class="result-detail-card" style="background: var(--bg2); border: 1px solid ${i === 0 ? 'var(--gold)' : 'var(--border)'}; border-radius: var(--radius); padding: 2rem; position: relative; overflow: hidden; animation: slideIn ${0.4 + (i * 0.1)}s ease;">
              ${i === 0 ? '<div style="position:absolute; top:1rem; right:1rem; background: var(--gold); color: #000; font-size: 0.7rem; font-weight: 800; padding: 0.3rem 0.8rem; border-radius: 100px;">⭐ BEST FIT</div>' : ''}
              
              <div style="display:flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                <span style="font-size: 2.5rem;">${info.icon}</span>
                <div>
                  <h3 style="font-family: var(--font-display); font-size: 1.3rem; font-weight: 800;">${c.name}</h3>
                  <div style="color: var(--gold); font-weight: 700; font-size: 0.9rem;">${pct}% Match Compatibility</div>
                </div>
              </div>

              <p style="color: var(--text2); font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem;">${info.desc}</p>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; border-top: 1px solid var(--border); pt-1.5rem; padding-top: 1.5rem;">
                <div>
                  <div style="font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 700;">Average Salary (INR)</div>
                  <div style="font-size: 1.25rem; font-weight: 800; color: var(--text);">${info.salary} <span style="font-size: 0.8rem; color: var(--text3);">/ year</span></div>
                </div>
                <div>
                  <div style="font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.8rem; font-weight: 700;">Critical Skills</div>
                  <div style="display: flex; flex-wrap: wrap; gap: 0.4rem;">
                    ${info.skills.map(s => `<span style="background: var(--surface2); color: var(--text2); font-size: 0.75rem; padding: 0.3rem 0.7rem; border-radius: 6px; border: 1px solid var(--border);">${s}</span>`).join('')}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="result-actions" style="margin-top: 3rem; justify-content: center; display: flex; gap: 1rem;">
        <a href="roadmap.html" class="btn btn-accent">View Roadmap for ${top.name}</a>
        <a href="skill-gap.html" class="btn btn-ghost">Analyze Skill Gap</a>
        <button class="btn btn-ghost" onclick="location.reload()">Retake Test</button>
      </div>
    </div>`;
}

renderQuestion();
</script>
</body>
</html>
